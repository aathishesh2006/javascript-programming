<!--
5c. At a restaurant, you order 1 coffee ($5), 2 bagels ($3 each), and 1 soup
($9). Calculate the cost and save it in a variable called 'cost'.
-->

<!DOCTYPE html>
<html>
    <body>
        <p>
            The order is :
        </p>
        <button onclick="alert(cost)">
            Bill
        </button>

        <script>
            let coffee = (5 * 1);
            let bagels = (2 * 3);
            let soup = (1 * 9);
            const cost = coffee + bagels + soup;
        </script>
    </body>
</html>
