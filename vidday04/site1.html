<!--
5a. Create a <script> element. Inside the <script>, create a variable
called 'name', and save your name in this variable (as a string).
-->

<!DOCTYPE html>
<html>
    <head>
        <title>
            Scripting 
        </title>
    </head>
    <body>
        <button onclick = "console.log(name)">
            name
        </button>
        <script>
            let name = "Aathi";
            console.log(name);
        </script>
    </body>
</html>
