<!--
5k. Use the shortcuts - and = in 5l and 5j.
-->
<!DOCTYPE html>
<html>
    <head>
        <title>
            Shortcuts...
        </title>
    </head>
    <body>
        <p>
            a = a + 4 Also equal to a + = 4;
            b = b - 7 Also equal to b - = 7;
        </p>
        <p>
            a++ also equal to a = a + 1
            a-- also equal to a = a - 1
        </p>

        <button onclick = " num ++; console.log(`num + 1 is ${num}`);">
            ++
        </button>

        <button onclick = " num = Math.max(0,num -= 1); console.log(`num - 1 is ${num}`);">
            --
        </button>
        <script>
            let num = 0;
        </script>
    </body>
</html>
