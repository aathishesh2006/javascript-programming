<!--
8f. Using Google or an A.l. tool, search how to convert a string to all
lowercase with JavaScript ('Good Morning' => 'good morning')
-->

<!DOCTYPE html>

<html>

    <head>

        <title>
            AI Tools
        </title>

        <body>

            <script>

                var name = 'Aathishesh';
                console.log('Printing name as it is == ${name}');
                console.log('Printing namr using toLowerCase() == ${name.toLowerCase()}');
                console.log('Printing namr using toUpperCase() == ${name.toUpperCase()}');

            </script>

        </body>

    </head>

</html>
