<!--
4e. Create 2 buttons 'Add to cart' and 'Buy now'. Use CSS to give them
yellow and orange background colors:
Add to cart
Buy now
-->

<!DOCTYPE html>
<html>

    <head>

        <title>
            HTML and CSS Review...
        </title>
        <style>
            .yellowbtn{
                background-color : yellow;
                color : black;
                border-color: black;
            }

            .orangebtn{
                background-color : orange;
                color : black;
                border-color: black;
            }
        </style>

    </head>

    <body>

        <button class = "yellowbtn">
            Add to cart
        </button>

        <button class = "orangebtn">
            Buy now
        </button>

    </body>

</html>
