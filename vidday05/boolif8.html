<!--
6k. Let's say the cart has a maximum quantity of 10. Before updating the
quantity, check if the quantity will be greater than 10:
• If it will, display a popup saying 'The cart is full' and don't update
the quantity.
• Otherwise, update the quantity and console.log() it as usual.
-->

<!DOCTYPE html>
<html>
    <head>
        <title>
            PURBYKARY
        </title>
    </head>
    <body>

        <button onclick ="
            console.log('The Maximum Cart Quantity is 10')
            if(cartquantity <= 9)
            {
                cartquantity = cartquantity + 1;
            }
            else
            {
                console.log('You have reached the maximum quantity');
            }
            console.log(`cartquantity = ${cartquantity}`)
        "
        class = "Add">
            Add to Cart
        </button>

        <button onclick ="
        console.log('The Maximum Cart Quantity is 10')
        if(cartquantity <= 6)
        {
            cartquantity = cartquantity + 4;
        }
        else
        {
            console.log('You have reached the maximum quantity');
        }
        console.log(`cartquantity = ${cartquantity}`)
        "
        class = "Add1">
            +4
        </button>

        <button onclick = "
        console.log('The Maximum Cart Quantity is 10')
        if(cartquantity <= 9)
        {
            cartquantity = cartquantity + 5;
        }
        else
        {
            console.log('You have reached the maximum quantity');
        }
        console.log(`cartquantity = ${cartquantity}`)
        "
        class = "Add2">
            +5
        </button>

        <button onclick = "
        cartquantity = 0;
        console.log('The cart is reset');
        console.log(`cartquantity is ${cartquantity}`);
        
        "
        class = "reset">
            Reset
        </button>

        <button onclick = "
        if(cartquantity - 2 < 0)
        {
            alert('Not enough items in the cart');
        }
        else
        {
            cartquantity = cartquantity - 2;
            console.log(`cartquantity is ${cartquantity}`);
        }"
        class = "Minus">
            -2
        </button>

        <button onclick = "
        if(cartquantity - 3 < 0)
        {
        alert('Not enough items in the cart');
        }
        else{
            cartquantity = cartquantity - 3;
            console.log(`cartquantity is ${cartquantity}`);
        }
    "
    class = "Minus1">
            -3
        </button>

        <style>

            }

                color: black;
            }

                color: black;
            }
            .Add2{
                background-color: plum;
                color: black;
            }
        </style>

        <script>
            let cartquantity = 0;
        </script>

    </body>

</html>
