    <script>

        function convertLitre(litre, from, to)
        {
            if(from == 'litre' && to == 'ml')
            {
                let litre1 = litre * 1000;
                console.log(`${litre1} ${to}`)
            }

            else if(from == 'ml' && to == 'litre')
            {
                let litre2 = litre / 1000;
                console.log(`${litre2} ${to}`)
            }

            else if(from == 'ml' && to == 'drops')
            {
                let litre3 = litre * 20;
                console.log(`${litre3} ${to}`)
            }

            else if(from == 'drops' && to == 'ml')
            {
                let litre4 = litre / 20;
                console.log(`${litre4} ${to}`)
            }

            else if(from == 'litre' && to == 'drops')
            {
                let litre5 = litre * 20000;
                console.log(`${litre5} ${to}`)
            }

            else if(from == 'drops' && to == 'litre')
            {

                console.log(`${litre6} ${to}`)
            }

            else if(from == 'kg' || to == 'kg')
            {

            }
        }
