<!--
7d. Create a function 'convertToFahrenheit(celsius)' that takes a number
in degrees Celsius and returns a number in degrees Fahrenheit.
• Formula: Fahrenheit = (Celsius * 9 / 5) + 32
• convertToFahrenheit(25) => 77
-->

<!DOCTYPE html>
<html>
    <head>
        <title>
            Function 4
        </title>
    </head>
    <body>
        <p>
            Given Celsius = 25
            Given Fahrenheit = 77
        </p>

        <button onclick="convertToFahrenheit(temp_c)">
            Convert Celsius to Fahrenheit 
        </button>

        <button onclick="convertTocelsius(temp_f)">
            Convert Farenheit to celsius 
        </button>

        <script>
            let temp_c = 25;
            let temp_f = 77;

            function convertToFahrenheit(celsius)
            {
                let result = (celsius * 9 / 5) + 32;
                console.log(`Farenheit: ${result}`);
            }

            function convertTocelsius(farenheit)
            {
                let result = (farenheit -32) * 5 / 9;
                console.log(`Cesius: ${result}`);
            }
        </script>
    </body>
</html>
