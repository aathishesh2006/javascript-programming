<!DOCTYPE html>
<html>
    <head>
        <title>
            Web Calculator
        </title>

        <style>
            body{
                font-family: Arial;
                border: blanchedalmond;
            }

            button{
                width: 50px;
                height: 50px;
                font-size: 15px;
                margin: 2px;
                color: orange;
                background-color: rgb(2, 2, 2);
                cursor: pointer;
            }

            .calculation{
                font-size: 35px;
                margin-bottom: 10px;
            }

            .clear-btn{
                width: 220px;
                height: 10 px;
                color: black;
                background-color: orange;
            }
        </style>
    </head>

    <body>
            <p class = "calculation" id = "calculation">
                0
            </p>

        <p>
        <button onclick = "updatecalculation('1');">
            1
        </button>

        <button onclick = "updatecalculation('2');">
            2
        </button>

        <button onclick = "updatecalculation('3');">
            3
        </button>

        <button onclick = "updatecalculation('+');">
            +
        </button>

        </p>

        <p>
        <button onclick = "updatecalculation('4');">
            4
        </button>

        <button onclick = "updatecalculation('5');">
            5
        </button>

        <button onclick = "updatecalculation('6');">
            6
        </button>

        <button onclick = "updatecalculation('-');">
            -
        </button>

        </p>

        <p>
        <button onclick = "updatecalculation('7');">
            7
        </button>

        <button onclick = "updatecalculation('8');">
            8
        </button>

        <button onclick = "updatecalculation('9');">
            9
        </button>

        <button onclick = "updatecalculation('*');">
            *
        </button>
        </p>

        <p>
        <button onclick = "updatecalculation('0');">
            0
        </button>

        <button onclick = "updatecalculation('.');">
            .
        </button>

        <button onclick = "calculateResult('=');">
            =
        </button>

        <button onclick = "updatecalculation('/');">
            /
        </button>
        </p>

        <p>

        <button class = "clear-btn" onclick = "clearCalculation();">
            Clear
        </button>
        </p>

        <script>
            let calculation = '';

            function updatecalculation(value){
                calculation = calculation + value;

                document.getElementById('calculation').innerText = calculation;
            }

            function calculateResult(){
                calculation = eval(calculation);

                document.getElementById('calculation').innerText = calculation;
            }

            function clearCalculation(){
                calculation ='';

                document.getElementById('calculation').innerText = '0';
            }

        </script>
    </body>
</html>
