7k. Create a copy of the Cart Quantity project from exercise 6l.
• Create a function 'updateCartQuantity' and reuse the code.
-->
<!DOCTYPE html>
<html>
  <head>
    <title>Purby Kary</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .cart-container {
        background-color: purple;
        width: 350px;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 5px;
      }

      .subtitle {
        color: pink;
        margin-bottom: 20px;
      }

      .quantity-display {
        background-color: orchid;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .quantity-display p {
        margin: 0;
        color: rgb(252, 251, 251);
        font-size: 14px;
      }

      .quantity {
        font-size: 50px;
        font-weight: bold;
        margin: 10px 0;
        color: #030005;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      button {
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        background-color: lavender;
        transition: 0.22s;
      }

      button:hover {
        background-color: #d1d5db;
      }

      .add-button {
        background-color: violet;
        color: black;
      }

      .add-button:hover {
        background-color: rgb(255, 255, 255);
      }

      .remove-button {
        background-color: rgb(0, 0, 0);
        color: violet;
      }

      .remove-button:hover {
        background-color: white;
        color: #030005;

      }

      .reset-button {
        grid-column: span 3;
        background-color: #fefbff;
        color: rgb(192, 43, 197);
      }

      .reset-button:hover {
        background-color: rgb(0, 0, 0);
      }

      .message {
        margin-top: 15px;
        font-size: 14px;
        color: #f5f2f5;
      }
    </style>
  </head>

  <body>

    <div class="cart-container">

      <h1>Cart Quantity</h1>

      <p class="subtitle">Manage your shopping cart</p>

      <div class="quantity-display">
        <p>Current Quantity</p>

        <div class="quantity" id="quantityDisplay">
          0
        </div>

        <p id="cartStatus">Your cart is empty</p>
      </div>

      <div class="buttons">

        <button onclick="showQuantity()">
          Show
        </button>

        <button class="add-button" onclick="updateCartQuantity(1)">
          +1
        </button>

        <button class="add-button" onclick="updateCartQuantity(2)">
          +2
        </button>

        <button class="add-button" onclick="updateCartQuantity(3)">
          +3
        </button>

        <button class="add-button" onclick="updateCartQuantity(4)">
          +4
        </button>

        <button class="add-button" onclick="updateCartQuantity(5)">
          +5
        </button>

        <button class="remove-button" onclick="updateCartQuantity(-1)">
          -1
        </button>

        <button class="remove-button" onclick="updateCartQuantity(-2)">
          -2
        </button>

        <button class="remove-button" onclick="updateCartQuantity(-3)">
          -3
        </button>

        <button class="reset-button" onclick="resetCartQuantity()">
          Reset Cart
        </button>

      </div>

      <p class="message" id="message"></p>

    </div>

    <script>

      let cartQuantity = 0;

      function updateCartQuantity(change) {

        if (cartQuantity + change > 10) {

          document.getElementById('message').innerText =
            'The cart is full! Maximum quantity is 10.';

        }

        else if (cartQuantity + change < 0) {

          document.getElementById('message').innerText =
            'Not enough items in the cart!';

        }

        else {

          cartQuantity = cartQuantity + change;

          document.getElementById('message').innerText =
            'Cart updated successfully!';

        }

        updateDisplay();

      }

      function showQuantity() {

        document.getElementById('message').innerText =
          'Current cart quantity: ' + cartQuantity;

      }

      function resetCartQuantity() {

        cartQuantity = 0;

        document.getElementById('message').innerText =
          'Cart was reset.';

        updateDisplay();

      }

      function updateDisplay() {

        document.getElementById('quantityDisplay').innerText =
          cartQuantity;

        if (cartQuantity === 0) {

          document.getElementById('cartStatus').innerText =
            'Your cart is empty';

        }

        else if (cartQuantity === 10) {

          document.getElementById('cartStatus').innerText =
            'Your cart is full';

        }

        else {

          document.getElementById('cartStatus').innerText =
            'Items in your cart';

        }

      }

    </script>

  </body>
</html>
